name: Sync YouTube uploads to Airtable
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install metadata extractor
        run: python3 -m pip install --quiet yt-dlp
      - name: Sync new videos
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          AIRTABLE_BASE_ID: appGwL6PPsIsZIS9a
          AIRTABLE_TABLE_ID: tbljINNeF0EmAMPJg
          YOUTUBE_HANDLE: bubudiet
        run: python3 scripts/sync_youtube_airtable.py
